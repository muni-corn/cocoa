[package]
name = "cocoa"
version = "0.6.0"
edition = "2024"
authors = ["municorn <municorn@musicaloft.com>"]
license = "GPL-3.0-or-later"

[lib]
name = "cocoa"
path = "src/lib.rs"

[[bin]]
name = "cocoa"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
clap_mangen = "0.3"
console = "0.16"
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
genai = "0.7"
git2 = "0.21"
glob = "0.3.3"
minijinja = { version = "3.0", features = ["serde"] }
nom = "8"
regex = "1"
rust-i18n = "4.2"
semver = "1.0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.13"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
toml_edit = "0.25.11"

[dev-dependencies]
assert_cmd = "2.1.1"
insta = "1.49.0"
predicates = "3.1.3"
tempfile = "3"
